<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; background: #020617; }
  svg { width: 512px; height: 512px; display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />
  
  <!-- Subtle decorative ambient circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Background Ambient Glow behind Icon -->
  <circle cx="256" cy="256" r="90" fill="#6366f1" opacity="0.25" filter="url(#glow)" />

  <!-- Outer Soundwaves (Left & Right) -->
  <!-- Left waves -->
  <rect x="110" y="226" width="12" height="60" rx="6" fill="#38bdf8" opacity="0.6" />
  <rect x="134" y="196" width="12" height="120" rx="6" fill="url(#neonGrad)" opacity="0.8" />
  <rect x="158" y="160" width="12" height="192" rx="6" fill="url(#neonGrad)" />

  <!-- Right waves -->
  <rect x="342" y="160" width="12" height="192" rx="6" fill="url(#neonGrad)" />
  <rect x="366" y="196" width="12" height="120" rx="6" fill="url(#neonGrad)" opacity="0.8" />
  <rect x="390" y="226" width="12" height="60" rx="6" fill="#ec4899" opacity="0.6" />

  <!-- Center 'S' Voice Loop & Mic Hybrid Motif -->
  <!-- Upper Curve of S -->
  <path d="M 285 145 C 235 145 200 175 200 215 C 200 255 240 265 265 275 C 295 287 312 300 312 325 C 312 355 285 375 245 375 C 215 375 195 360 185 345"
        fill="none" 
        stroke="url(#neonGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#softGlow)" />

  <!-- Central Dynamic Accent Sphere -->
  <circle cx="256" cy="256" r="16" fill="#38bdf8" filter="url(#softGlow)" />

  <!-- Small Sparkling Accent Dots -->
  <circle cx="330" cy="140" r="5" fill="#38bdf8" />
  <circle cx="170" cy="385" r="5" fill="#ec4899" />
</svg>

</body>
</html>
