<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad2" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Emerald to Cyan Gradient -->
    <linearGradient id="bubble1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Indigo to Violet Gradient -->
    <linearGradient id="bubble2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="3" />
  
  <!-- Subtle Background Rings -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 6" />

  <!-- Primary Chat Bubble (Left/Top) -->
  <g filter="url(#glow2)">
    <!-- Main Bubble -->
    <path d="M 160 140 C 230 140 280 170 280 220 C 280 270 230 300 160 300 C 145 300 130 298 115 292 L 80 305 L 95 275 C 75 260 65 240 65 220 C 65 170 105 140 160 140 Z"
          fill="url(#bubble1)" opacity="0.9" />

    <!-- Wave lines inside first bubble -->
    <rect x="110" y="205" width="8" height="30" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="130" y="190" width="8" height="60" rx="4" fill="#ffffff" />
    <rect x="150" y="175" width="8" height="90" rx="4" fill="#ffffff" />
    <rect x="170" y="195" width="8" height="50" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="190" y="210" width="8" height="20" rx="4" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Secondary Overlapping Chat Bubble (Right/Bottom) -->
  <g filter="url(#glow2)">
    <path d="M 340 200 C 410 200 455 235 455 285 C 455 335 410 370 340 370 C 325 370 310 368 295 362 L 260 375 L 275 345 C 255 330 245 310 245 285 C 245 235 285 200 340 200 Z"
          fill="url(#bubble2)" opacity="0.9" />

    <!-- AI Sparkle / Star in second bubble -->
    <path d="M 350 250 L 356 270 L 376 276 L 356 282 L 350 302 L 344 282 L 324 276 L 344 270 Z" fill="#ffffff" />
    <circle cx="395" cy="260" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="310" cy="310" r="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Central Connection Pulse -->
  <circle cx="260" cy="255" r="12" fill="#ffffff" filter="url(#glow2)" />
</svg>
