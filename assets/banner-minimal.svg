<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <radialGradient id="minBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#18182b" />
      <stop offset="60%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <linearGradient id="textGradMin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="softGlowMin" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#minBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient light -->
  <circle cx="600" cy="140" r="130" fill="#6366f1" opacity="0.18" filter="url(#softGlowMin)" />

  <g transform="translate(600, 190)" text-anchor="middle">
    <!-- Centered Logo Icon Mini -->
    <g transform="translate(-36, -135)">
      <rect width="72" height="72" rx="20" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <path d="M 42 22 C 30 22 24 28 24 34 C 24 40 30 42 36 44 C 42 46 48 48 48 54 C 48 60 42 64 34 64" fill="none" stroke="url(#textGradMin)" stroke-width="6" stroke-linecap="round" />
      <circle cx="36" cy="43" r="3.5" fill="#38bdf8" />
    </g>

    <!-- Main Title -->
    <text y="-10" fill="url(#textGradMin)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-0.5">
      SpeakUp
    </text>

    <!-- Subtitle -->
    <text y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      Native English Speaking Coach &amp; Real-Time Feedback Simulator
    </text>
    <text y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
      Built for Bangla speakers • Voice Input (STT) • Native Pronunciation (TTS) • Grammar Explanations in বাংলা
    </text>

    <!-- Badges -->
    <g transform="translate(0, 95)">
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">🎙️ Web Speech API</text>
      </g>
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">🔊 Natural Voice</text>
      </g>
      <g transform="translate(80, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">🇧🇩 Bangla Diagnostics</text>
      </g>
      <g transform="translate(240, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">⚡ Zero Config</text>
      </g>
    </g>
  </g>
</svg>
